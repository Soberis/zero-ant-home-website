image: $HARBOR_HOST/$HARBOR_PROJECT/zeroant_homewebsite:latest

variables:
  NPM_CONFIG_CACHE: .npm
  CI: true

cache:
  key: ${CI_COMMIT_REF_SLUG}-${CI_PROJECT_ID}
  paths:
    - node_modules/
    - .npm/

stages:
  - build
  - deploy

# 构建阶段
build:
  stage: build
  image: node:20.19.0-bullseye
  before_script:
    - corepack enable
    - corepack prepare yarn@1.22.22 --activate
  script:
    - yarn install
    - yarn build
  artifacts:
    paths:
      - dist/

# 部署到测试服务器(内部百度云服务器)
# 仅仅在 develop 分支上进行部署
deploy_test_server:
  stage: deploy
  environment:
    name: test
    url: https://test_www.zeroant.com
  cache:
    key:
      files:
        - package-lock.json
      prefix: npm
    paths:
      - node_modules/
  before_script:
    - echo "Deploying to test environment"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # 直接使用文件变量（路径自动保存在 $BAIDU_PRIVATE_CLOUD_SSH_PRIVATE_KEY_FILE 环境变量中）
    - cp $BAIDU_PRIVATE_CLOUD_SSH_PRIVATE_KEY_FILE ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan ${BAIDU_PRIVATE_CLOUD_DEPLOY_SERVER} >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to test server"
    - export SERVER_NAME="test_www.zeroant.com"
    # 只替换 SERVER_NAME，REWRITE_HTTPS 为空，并删除 443 server 块
    - |
      sed "s/{{SERVER_NAME}}/$SERVER_NAME/g; s/# {{REWRITE_HTTPS}}//g" config/nginx.conf.template | awk '
        BEGIN { block=0; brace=0 }
        /^\s*server\s*{/ { block=1; brace=1; buf=$0; next }
        block {
          buf=buf"\n"$0;
          brace=brace+gsub(/{/,"")-gsub(/}/,"");
          if (brace==0) {
            if (buf ~ /listen[[:space:]]+443([[:space:]]|;)/) { block=0; buf=""; next }
            print buf;
            block=0; buf="";
          }
          next;
        }
        { print }
      ' > dist/nginx.conf
    - cat dist/nginx.conf # 输出生成的 nginx 配置文件内容
    # 部署到测试服务器上
    - rsync -avz --delete dist/ root@${BAIDU_PRIVATE_CLOUD_DEPLOY_SERVER}:/mnt/disk1/zeroant/home_web/
    - ssh root@${BAIDU_PRIVATE_CLOUD_DEPLOY_SERVER} "/usr/local/nginx/sbin/nginx -s reload"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" # 仅在 develop 分支上进行部署
      when: on_success # 仅在成功时触发
      allow_failure: false # 不允许失败
    - when: never # 默认不执行，除非满足上面的条件

# 仅仅在主分支上打指定标签的时候进行部署， 部署到阿里云ECS服务器
deploy_ALI_CLOUD_ECS:
  stage: deploy
  environment:
    name: production
    url: https://zeroant.com
  cache:
    key:
      files:
        - package-lock.json
      prefix: npm
    paths:
      - node_modules/
  before_script:
    - echo "Deploying to production environment"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # 直接使用文件变量（路径自动保存在 $ALI_CLOUD_ECS_SSH_PRIVATE_KEY_FILE 环境变量中）
    - cp $ALI_CLOUD_ECS_SSH_PRIVATE_KEY_FILE ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan ${ALI_CLOUD_ECS_DEPLOY_SERVER} >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to production"
    - export SERVER_NAME="zeroant.com www.zeroant.com"
    - sed "s/{{SERVER_NAME}}/$SERVER_NAME/g" config/nginx.conf.template > dist/nginx.conf
    # 替换 SERVER_NAME，并将 {{REWRITE_HTTPS}} 替换为 rewrite 规则
    - sed "s/{{SERVER_NAME}}/$SERVER_NAME/g; s/# {{REWRITE_HTTPS}}/rewrite ^(.*)$ https:\/\/\$host\$1 permanent;/g" config/nginx.conf.template > dist/nginx.conf
    # 部署到阿里云上
    - rsync -avz --delete dist/ root@${ALI_CLOUD_ECS_DEPLOY_SERVER}:/mnt/disk1/zeroant/home_web/
    - ssh root@${ALI_CLOUD_ECS_DEPLOY_SERVER} "/usr/local/nginx/sbin/nginx -t -c /mnt/disk1/zeroant/home_web/nginx.conf"
    - ssh root@${ALI_CLOUD_ECS_DEPLOY_SERVER} "/usr/local/nginx/sbin/nginx -s reload"
  # 仅仅在打指定标签的时候进行部署
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-\w+)?$/
      when: on_success # 仅在成功时触发
      allow_failure: false # 不允许失败
    - when: never # 默认不执行，除非满足上面的条件
