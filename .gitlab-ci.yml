image: $HARBOR_HOST/$HARBOR_PROJECT/node

variables:
  NPM_CONFIG_CACHE: .npm
  CI: true


cache:
  key: ${CI_COMMIT_REF_SLUG}-${CI_PROJECT_ID}
  paths:
    - node_modules/
    - .npm/

stages:
  - build
  - deploy

build:
  stage: build
  script:
    - yarn install
    - yarn build
  artifacts:
    paths:
      - dist/

pages:
  stage: deploy
  cache:
    key:
      files:
        - package-lock.json
      prefix: npm
    paths:
      - node_modules/
  script:
    - npm install
    - npm run build
    - cp -a dist/. public/
  artifacts:
    paths:
      - public
  only:
    refs:
      - develop
  environment:
    name: staging
    url: https://$CI_PROJECT_NAMESPACE.pages.rosc.org.cn/$CI_PROJECT_NAME
