image: $HARBOR_HOST/$HARBOR_PROJECT/node

variables:
  NPM_CONFIG_CACHE: .npm
  CI: true

cache:
  key: ${CI_COMMIT_REF_SLUG}-${CI_PROJECT_ID}
  paths:
    - node_modules/
    - .npm/

stages:
  - build
  - deploy

build:
  stage: build
  script:
    - yarn install
    - yarn build
  artifacts:
    paths:
      - dist/

# 部署到GitLab Pages
pages:
  stage: deploy
  script:
    - echo "Pages accessible through ${CI_PAGES_URL}/${PAGES_PREFIX}"
    - cp -a dist/. public/
  cache:
    key:
      files:
        - package-lock.json
      prefix: npm
    paths:
      - node_modules/
  variables:
    PAGES_PREFIX: "" # no prefix by default (master)
  pages:
    path_prefix: "$PAGES_PREFIX"
  environment:
    name: "Pages ${PAGES_PREFIX}"
    url: "${CI_PAGES_URL}/${PAGES_PREFIX}"
    auto_stop_in: 2 days # 2天后自动清理
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" # ensure to run on master (with default PAGES_PREFIX)
      variables:
        PAGES_PREFIX: "_dev" # prefix with _stg for the staging branch
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" # conditionally change the prefix on Merge Requests
      when: manual # run pages manually on Merge Requests
      variables:
        PAGES_PREFIX: "mr-$CI_MERGE_REQUEST_IID" # prefix with the mr-<iid>, like `mr-123`

# 仅在主分支上部署
deploy:
  stage: deploy
  environment:
    name: production
    url: https://zeroant.com
  cache:
    key:
      files:
        - package-lock.json
      prefix: npm
    paths:
      - node_modules/
  before_script:
    - echo "Deploying to production environment"
    - apt-get update -y
    - apt-get install -y openssh-client rsync
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # 直接使用文件变量（路径自动保存在 $ALI_CLOUD_ECS_SSH_PRIVATE_KEY_FILE 环境变量中）
    - cp $ALI_CLOUD_ECS_SSH_PRIVATE_KEY_FILE ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan ${ALI_CLOUD_ECS_DEPLOY_SERVER} >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to production"
    # 部署到阿里云上
    - rsync -avz --delete dist/ root@${ALI_CLOUD_ECS_DEPLOY_SERVER}:/mnt/disk1/zeroant/home_web/
  only:
    - master
