  <body>
    <div id="app">
      <style>
        .za-initial-loader {
          position: fixed;
          top: 0; left: 0; width: 100%; height: 100%;
          background: #f8f9fb;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 9999;
          font-family: "Outfit", -apple-system, sans-serif;
        }
        .za-loader-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 20px;
        }
        .za-loader-spinner {
          width: 36px;
          height: 36px;
          border: 3px solid rgba(26, 58, 143, 0.1);
          border-top-color: #1a3a8f;
          border-radius: 50%;
          animation: za-spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .za-loader-text {
          color: #1a3a8f;
          font-size: 12px;
          font-weight: 600;
          letter-spacing: 0.15em;
          text-transform: uppercase;
          opacity: 0.8;
          animation: za-pulse 2s ease-in-out infinite;
        }
        @keyframes za-spin {
          to { transform: rotate(360deg); }
        }
        @keyframes za-pulse {
          0%, 100% { opacity: 0.5; }
          50% { opacity: 1; }
        }
      </style>
      <div class="za-initial-loader">
        <div class="za-loader-content">
          <div class="za-loader-spinner"></div>
          <div class="za-loader-text">ZEROANT</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
